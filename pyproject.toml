[project]
name = "gamblers-terminal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.138.0",
    "starlette~=1.3.0",          # transitive via fastapi; pinned (TestClient stack)
    "uvicorn[standard]~=0.49.0",
    "jinja2~=3.1.6",
    "itsdangerous~=2.2.0",
    "yfinance~=1.4.1",
    "requests~=2.32.4",
    "pandas~=3.0.3",
    "lxml~=6.1.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "httpx~=0.28.1",             # Starlette TestClient backend (see pytest options)
    "playwright~=1.60",          # E2E chart test; auto-skips without chromium
    "mypy>=1.15",
    "ruff>=0.8",
]

[tool.uv]
package = false
# Supply-chain cooldown; README covers exempting a security fix.
exclude-newer = "14 days"

[tool.pytest.ini_options]
pythonpath = ["."]
# Staying on httpx for Starlette TestClient; silence its benign deprecation warning.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.ruff.lint]
# Risky calls (bandit) and common bugbear traps.
select = ["B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"modules/pe_monitor/storage.py" = ["S608"]  # identifiers come from ROW_COLS
